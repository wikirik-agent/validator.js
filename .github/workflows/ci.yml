name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build on Node.js 24
    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Compile ES5 test suite
        run: node scripts/build-es5-tests.js
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            index.js
            lib/
            es/
            validator.js
            validator.min.js
            test-es5/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 22, 20, 18, 16, 14, 12, 10, 8]
    name: Run tests on Node.js ${{ matrix.node-version }}
    steps:
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    - name: Run tests
      run: npm run test:ci
    - if: matrix.node-version == 24
      name: Send coverage info to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  # Mocha, nyc and npm install do not work on these Node.js versions, so the
  # suite compiled to ES5 by the build job runs with its own dependency-free
  # runner, against the built index.js, lib/ and validator(.min).js.
  test-es5:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['0.10', '0.12', '4', '6']
    name: Run ES5 test suite on Node.js ${{ matrix.node-version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
    # actions/setup-node's version manifest starts at 6.17.1, so install with
    # nvm like ljharb/actions does; it downloads and checksums nodejs.org builds.
    - name: Install Node.js ${{ matrix.node-version }} with nvm
      env:
        NODE_VERSION: ${{ matrix.node-version }}
      run: |
        export NVM_DIR="$RUNNER_TEMP/nvm"
        git -c advice.detachedHead=false clone --quiet --depth 1 --branch v0.40.3 https://github.com/nvm-sh/nvm.git "$NVM_DIR"
        . "$NVM_DIR/nvm.sh"
        nvm install "$NODE_VERSION"
        echo "$NVM_BIN" >> "$GITHUB_PATH"
    - name: Run ES5 test suite
      run: |
        node --version
        node test-es5/run.js

  browser:
    needs: build
    runs-on: ubuntu-latest
    name: Run tests in Chromium, Firefox and WebKit
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Pinned; installed with --no-save because Playwright needs a newer
      # Node.js than the development dependencies support.
      PLAYWRIGHT_VERSION: 1.63.0
      REQUIREJS_VERSION: 2.3.8
    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
      - name: Install dependencies, Playwright and RequireJS
        run: npm install --legacy-peer-deps --no-save "playwright@$PLAYWRIGHT_VERSION" "requirejs@$REQUIREJS_VERSION"
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run tests in browsers
        run: npm run test:browser
